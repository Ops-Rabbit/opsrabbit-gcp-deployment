{{- if and (not .Values.secrets.existingSecret) (or .Values.secrets.databaseUrl .Values.secrets.betterAuthSecret .Values.secrets.encryptionKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsrabbit.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsrabbit.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.databaseUrl }}
  {{ .Values.secrets.databaseUrlKey }}: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.betterAuthSecret }}
  {{ .Values.secrets.betterAuthSecretKey }}: {{ .Values.secrets.betterAuthSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.encryptionKey }}
  {{ .Values.secrets.encryptionKeyKey }}: {{ .Values.secrets.encryptionKey | quote }}
  {{- end }}
{{- end }}
