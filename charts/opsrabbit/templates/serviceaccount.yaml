{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opsrabbit.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsrabbit.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  {{- if and .Values.serviceAccount.gkeWorkloadIdentity.projectId .Values.serviceAccount.gkeWorkloadIdentity.gcpServiceAccount }}
  annotations:
    iam.gke.io/gcp-service-account: {{ printf "%s@%s.iam.gserviceaccount.com" .Values.serviceAccount.gkeWorkloadIdentity.gcpServiceAccount .Values.serviceAccount.gkeWorkloadIdentity.projectId | quote }}
  {{- end }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
